{% extends "base.html" %}{% block title %}রেজিস্ট্রেশন | RAFIN{% endblock %}{% block content %}
<div class="form-card"><h2>Retailer Registration</h2><p class="text-muted">অ্যাকাউন্ট অনুমোদনের জন্য আবেদন করুন।</p><form method="post">
<label class="form-label">পুরো নাম</label><input class="form-control mb-3" name="name" required maxlength="100">
<label class="form-label">ইমেল</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">মোবাইল নম্বর</label><input class="form-control mb-3" name="phone" required maxlength="20">
<label class="form-label">পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
<button class="btn btn-primary w-100">রেজিস্ট্রেশন করুন</button></form></div>{% endblock %}
