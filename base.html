<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}RAFIN PAN CARD SERVICE{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container">
<a class="navbar-brand fw-bold" href="{{ url_for('index') }}">RAFIN PAN CARD SERVICE</a>
<div class="navbar-nav ms-auto"><a class="nav-link" href="{{ url_for('register') }}">রেজিস্ট্রেশন</a><a class="nav-link" href="{{ url_for('login') }}">লগইন</a><a class="nav-link" href="{{ url_for('admin_login') }}">Admin</a></div>
</div></nav><main class="container py-4">
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ category }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><footer class="text-center py-4 text-muted small">Demo portal • বাস্তব PAN পরিষেবার সঙ্গে সংযুক্ত নয়</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
